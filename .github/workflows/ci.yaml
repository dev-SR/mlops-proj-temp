name: Shoppers MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  MLFLOW_TRACKING_URI: file:///tmp/mlruns
  MLFLOW_HOST_TRACKING_URI: file:///tmp/mlruns
  MLFLOW_REGISTERED_MODEL: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements_dev.txt
      - name: Ensure raw data present for tests
        run: |
          mkdir -p data/raw
          if [ ! -f data/raw/shoppers.csv ]; then
            cp tests/fixtures/shoppers.csv data/raw/shoppers.csv
          fi
      - name: Flake8
        run: flake8 src tests app --count --show-source --statistics
      - name: Pyright (mild strict)
        run: |
          pip install pyright==1.1.400
          pyright src
      - name: Pytest
        run: pytest -v
      - name: Coverage
        run: |
          coverage run -m pytest
          coverage report -m --fail-under=95

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
